name: Deploy to k3s

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/cwnelson215/pantry-bot

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.34.0'

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.4.3'

      - name: Connect to tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply app-secrets
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SPOONACULAR_API_KEY: ${{ secrets.SPOONACULAR_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          kubectl create secret generic app-secrets \
            --namespace pantry-bot \
            --from-literal=SESSION_SECRET="$SESSION_SECRET" \
            --from-literal=SPOONACULAR_API_KEY="$SPOONACULAR_API_KEY" \
            --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            --from-literal=USDA_API_KEY="$USDA_API_KEY" \
            --dry-run=client -o yaml \
            | kubectl apply -f -

      - name: Set image tag in overlay
        working-directory: k8s/overlays/prod
        run: kustomize edit set image "$IMAGE=$IMAGE:$GITHUB_SHA"

      - name: Apply manifests
        run: kubectl apply -k k8s/overlays/prod

      - name: Wait for rollout
        run: kubectl rollout status deployment/pantry-bot -n pantry-bot --timeout=3m
